<script>/* Lossless delivery for the hosted game. The offline HTML reads its embedded assets. */
(() => {
  'use strict';

  const config = JSON.parse(document.getElementById('game-delivery-config')?.textContent || '{}');
  const site = new URL('.', document.baseURI);
  const digestPattern = /^[a-f0-9]{64}$/i;
  const sources = [{base:site, failures:0, busy:0}];
  for (const value of config.mirrors || []) {
    try {
      const base = new URL(value);
      if (base.protocol !== 'https:' || base.username || base.password) continue;
      if (!base.pathname.endsWith('/')) base.pathname += '/';
      if (!sources.some(source => source.base.href === base.href)) sources.push({base, failures:0, busy:0});
    } catch { /* An unavailable mirror never excludes the site itself. */ }
  }

  function relative(path) {
    const clean = typeof path === 'string' ? path.replace(/^\.\//, '') : '';
    if (!/^[a-zA-Z0-9_./-]+$/.test(clean) || clean.split('/').some(s => !s || s === '.' || s === '..')) {
      throw new Error('无效资源路径');
    }
    return clean;
  }

  function address(source, path) {
    const url = new URL(relative(path), source.base);
    url.search = source.base.search;
    return url.href;
  }

  const abortError = () => new DOMException('读取已取消', 'AbortError');
  function checkAbort(signal) {
    if (signal?.aborted) throw signal.reason || abortError();
  }

  async function verify(buffer, expected) {
    if (!digestPattern.test(expected)) throw new Error('缺少资源校验值');
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', buffer));
    const hex = Array.from(hash, byte => byte.toString(16).padStart(2, '0')).join('');
    if (hex !== expected.toLowerCase()) throw new Error('下载内容校验不符');
    return buffer;
  }

  // Shared transfers stay alive until their last consumer leaves. A replacement
  // selection can immediately start a new job for a previously cancelled file.
  const jobs = new Map();
  function shared(key, signal, produce) {
    if (signal?.aborted) return Promise.reject(signal.reason || abortError());
    let job = jobs.get(key);
    if (!job) {
      const controller = new AbortController();
      job = {controller, subscribers:0};
      jobs.set(key, job);
      job.promise = Promise.resolve().then(() => produce(controller.signal)).finally(() => {
        job.done = true;
        if (jobs.get(key) === job) jobs.delete(key);
      });
    }
    job.subscribers++;
    return new Promise((resolve, reject) => {
      let finished = false;
      function finish(fn, value) {
        if (finished) return;
        finished = true;
        signal?.removeEventListener('abort', cancel);
        if (--job.subscribers === 0 && !job.done) {
          if (jobs.get(key) === job) jobs.delete(key);
          job.controller.abort();
        }
        fn(value);
      }
      function cancel() { finish(reject, signal.reason || abortError()); }
      signal?.addEventListener('abort', cancel, {once:true});
      job.promise.then(value => finish(resolve, value), err => finish(reject, err));
    });
  }

  const queue = [];
  let active = 0;
  function pump() {
    while (active < 4 && queue.length) {
      const task = queue.shift();
      task.signal.removeEventListener('abort', task.cancel);
      if (task.signal.aborted) { task.reject(abortError()); continue; }
      active++;
      Promise.resolve().then(task.run).then(task.resolve, task.reject).finally(() => { active--; pump(); });
    }
  }
  function schedule(priority, signal, run) {
    checkAbort(signal);
    return new Promise((resolve, reject) => {
      const task = {priority, signal, run, resolve, reject};
      task.cancel = () => {
        const index = queue.indexOf(task);
        if (index >= 0) queue.splice(index, 1);
        reject(signal.reason || abortError());
      };
      signal.addEventListener('abort', task.cancel, {once:true});
      const index = queue.findIndex(other => other.priority < priority);
      if (index < 0) queue.push(task); else queue.splice(index, 0, task);
      pump();
    });
  }

  let cachePromise;
  function storage() {
    if (!cachePromise) {
      cachePromise = Promise.resolve().then(() => caches.open('cloud-isles-delivery-v1:' + site.pathname)).catch(() => null);
    }
    return cachePromise;
  }
  const cacheKey = sha => new URL('.cloud-isles-cache/' + sha, site).href;
  async function cacheRead(cache, sha, signal) {
    if (!cache) return null;
    try {
      const found = await cache.match(cacheKey(sha));
      if (!found) return null;
      const buffer = await found.arrayBuffer();
      checkAbort(signal);
      return await verify(buffer, sha);
    } catch {
      checkAbort(signal);
      await cache.delete(cacheKey(sha)).catch(() => {});
      return null;
    }
  }
  async function cacheWrite(cache, sha, buffer) {
    if (cache) {
      try { await cache.put(cacheKey(sha), new Response(buffer)); } catch { /* Private browsing or full storage. */ }
    }
  }

  // Predict the cost of the next piece using observed first-byte latency and
  // transfer rate. Busy routes share capacity; a failed route gets a cooldown.
  function score(source, bytes) {
    const primary = source === sources[0];
    const latency = source.latency ?? (primary ? 160 : 440);
    const rate = source.rate ?? 1000; // bytes/ms before the first body measurement
    const unavailable = (source.retryAfter || 0) > performance.now();
    return (unavailable ? 1000000 : 0) + latency + bytes / rate * (1 + source.busy);
  }
  const blend = (old, value) => old == null ? value : old * .55 + value * .45;

  async function transfer(source, path, options) {
    const {signal, alternate, wireSize, priority, immutable} = options;
    checkAbort(signal);
    const child = new AbortController();
    const cancel = () => child.abort();
    signal.addEventListener('abort', cancel, {once:true});
    const start = performance.now();
    let first, last = start, count = 0, stalled = false;
    // An alternate gets a turn only after a missing/stalled response, or a
    // measured slow transfer still far from completion. The last route may
    // take much longer on a genuinely slow connection.
    const timer = setInterval(() => {
      const now = performance.now();
      const inactivity = options.manifest ? (alternate ? 1900 : 3500) : alternate ? (first == null ? 2600 : 3500) : 18000;
      const slow = alternate && first != null && now - first > 3000 &&
        count / (now - first) < 35 && wireSize - count > 48 * 1024;
      if (now-last > inactivity || slow || now-start > (alternate ? 25000 : 120000)) {
        stalled = true; child.abort();
      }
    }, 250);
    try {
      const response = await fetch(address(source,path), {
        signal:child.signal, priority:priority > 0 ? 'high' : priority < 0 ? 'low' : 'auto',
        cache:immutable ? 'force-cache' : 'default', credentials:source === sources[0] ? 'same-origin' : 'omit'
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const limit = options.maxBytes ?? Infinity;
      const reported = Number(response.headers.get('content-length'));
      if (reported > limit + 1024) throw new Error('资源响应过大');
      let buffer;
      if (response.body?.getReader) {
        const reader = response.body.getReader(), chunks = [];
        try {
          while (true) {
            const {done,value} = await reader.read();
            if (done) break;
            last = performance.now();
            if (first == null) first = last;
            count += value.byteLength;
            if (count > limit) throw new Error('资源响应过大');
            chunks.push(value);
          }
        } finally { reader.releaseLock(); }
        // The typical half-megabyte piece uses only a small bounded buffer.
        const bytes = new Uint8Array(count);
        let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
        buffer = bytes.buffer;
      } else {
        first = last = performance.now();
        buffer = await response.arrayBuffer();
        count = buffer.byteLength;
        if (count > limit) throw new Error('资源响应过大');
      }
      checkAbort(signal);
      const end = performance.now();
      const latency = Math.max(1,(first ?? end) - start);
      return {buffer, latency, rate:count > 24 * 1024 ? count / Math.max(12,end-(first ?? start)) : null};
    } catch (err) {
      checkAbort(signal);
      if (stalled) throw new Error('资源线路响应超时');
      throw err;
    } finally {
      clearInterval(timer);
      signal.removeEventListener('abort',cancel);
      child.abort();
    }
  }

  async function download(path, options, accept) {
    const {signal, priority, wireSize, candidates = sources} = options;
    const pending = new Set(candidates);
    let lastError;
    while (pending.size) {
      checkAbort(signal);
      try {
        return await schedule(priority,signal,async () => {
          checkAbort(signal);
          const source = [...pending].sort((a,b) => score(a,wireSize)-score(b,wireSize))[0];
          pending.delete(source);
          source.busy++;
          try {
            const measured = await transfer(source,path,{...options,alternate:pending.size>0});
            checkAbort(signal);
            const accepted = await accept(measured.buffer);
            checkAbort(signal);
            source.failures = 0; source.retryAfter = 0;
            source.latency = blend(source.latency,measured.latency);
            if (measured.rate != null) source.rate = blend(source.rate,Math.max(1,measured.rate));
            return accepted;
          } catch (err) {
            checkAbort(signal);
            source.retryAfter = performance.now() + Math.min(60000,5000 * ++source.failures);
            throw err;
          } finally { source.busy--; }
        });
      } catch (err) { checkAbort(signal); lastError = err; }
    }
    throw lastError;
  }

  let manifest, retryManifestAt = 0;
  async function loadManifest(signal) {
    if (manifest) return manifest;
    if (performance.now() < retryManifestAt) throw new Error('暂时无法读取传输清单');
    return shared(':manifest',signal,async jobSignal => {
      try {
        const cache = await storage();
        const expected = config.manifestSha256;
        let buffer = await cacheRead(cache,expected,jobSignal);
        if (!buffer) {
          buffer = await download(config.manifest, {
            signal:jobSignal, priority:3, wireSize:16384, maxBytes:1024*1024, immutable:true, manifest:true
          }, bytes => verify(bytes,expected));
          await cacheWrite(cache,expected,buffer);
        }
        checkAbort(jobSignal);
        const data = JSON.parse(new TextDecoder().decode(buffer));
        if (data.version !== 1 || data.encoding !== 'gzip' || !data.files?.[relative(data.entry)]) throw new Error('不支持的传输清单');
        manifest = data;
        return data;
      } catch (err) {
        checkAbort(jobSignal);
        retryManifestAt = performance.now()+10000;
        throw err;
      }
    });
  }

  async function decodePiece(packed, part, signal) {
    const head = new Uint8Array(packed,0,Math.min(2,packed.byteLength));
    let raw = packed;
    // Some HTTP hosts already decompress .gz via Content-Encoding.
    if (head[0] === 31 && head[1] === 139) {
      const reader = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
      const out = new Uint8Array(part.size);
      let offset = 0;
      try {
        while (true) {
          checkAbort(signal);
          const {done,value} = await reader.read();
          if (done) break;
          if (offset + value.byteLength > out.length) throw new Error('解压资源超出预期长度');
          out.set(value,offset);
          offset += value.byteLength;
        }
        if (offset !== out.length) throw new Error('资源片段不完整');
      } finally { await reader.cancel().catch(() => {}); reader.releaseLock(); }
      raw = out.buffer;
    }
    if (raw.byteLength !== part.size) throw new Error('资源片段长度错误');
    return verify(raw,part.sha256);
  }

  async function assemble(file, cache, signal, priority) {
    const controller = new AbortController();
    const cancel = () => controller.abort();
    checkAbort(signal);
    signal.addEventListener('abort',cancel,{once:true});
    let next = 0;
    try {
      let offset = 0;
      if (!Number.isSafeInteger(file.size) || file.size < 0 || !Array.isArray(file.parts)) throw new Error('资源长度无效');
      for (const part of file.parts) {
        if (!Number.isSafeInteger(part.size) || part.size <= 0 || part.offset !== offset ||
            !Number.isSafeInteger(part.encodedSize) || part.encodedSize <= 0 || !digestPattern.test(part.sha256)) {
          throw new Error('资源片段清单无效');
        }
        relative(part.url);
        offset += part.size;
      }
      if (offset !== file.size) throw new Error('资源片段范围无效');
      const result = new Uint8Array(file.size);
      async function worker() {
        while (next < file.parts.length) {
          checkAbort(controller.signal);
          const part = file.parts[next++];
          let raw = await cacheRead(cache,part.sha256,controller.signal);
          if (!raw) {
            raw = await download(part.url, {
              signal:controller.signal, priority, wireSize:part.encodedSize, immutable:true, maxBytes:Math.max(part.size,part.encodedSize)
            }, bytes => decodePiece(bytes,part,controller.signal));
            await cacheWrite(cache,part.sha256,raw);
          }
          checkAbort(controller.signal);
          result.set(new Uint8Array(raw),part.offset);
        }
      }
      await Promise.all(Array.from({length:Math.min(3,file.parts.length)},worker));
      return await verify(result.buffer,file.sha256);
    } finally {
      controller.abort();
      signal.removeEventListener('abort',cancel);
    }
  }

  // Short reuse window for the shell's prefetch and the game's later reader.
  // Keep private copies so handing an engine a transferable buffer is safe.
  const recent = new Map();
  const memoryLimit = 12 * 1024 * 1024;
  let recentBytes = 0;
  function forget(name) {
    const entry = recent.get(name);
    if (!entry) return;
    clearTimeout(entry.timer); recentBytes -= entry.buffer.byteLength; recent.delete(name);
  }
  function remember(name, buffer) {
    if (buffer.byteLength > memoryLimit) return;
    while (recent.size && recentBytes + buffer.byteLength > memoryLimit) {
      forget(recent.keys().next().value);
    }
    recent.set(name,{buffer,timer:setTimeout(() => forget(name),45000)});
    recentBytes += buffer.byteLength;
  }

  async function readFile(name, signal, priority) {
    const engine = name === '@engine';
    const path = relative(engine ? config.engine : 'assets/'+relative(name));
    const canVerify = !!globalThis.crypto?.subtle;
    let file;
    const cache = canVerify ? await storage() : null;
    if (canVerify && config.manifest && digestPattern.test(config.manifestSha256)) {
      try {
        const data = await loadManifest(signal);
        if (engine && relative(data.entry) !== path) throw new Error('入口版本不一致');
        file = data.files[path];
        if (engine && file && file.sha256 !== config.engineSha256) file = null;
      } catch (err) { checkAbort(signal); }
    }
    const expected = engine ? config.engineSha256 : file?.sha256;
    const authenticated = canVerify && digestPattern.test(expected);
    if (cache && authenticated) {
      const whole = await cacheRead(cache,expected,signal);
      if (whole) return whole;
    }
    if (file && typeof DecompressionStream === 'function') {
      try {
        return await assemble(file,cache,signal,priority);
      } catch (err) { checkAbort(signal); }
    }

    // A whole-file fallback downloads one copy at a time. Only independently
    // verified bytes may be accepted from a mirror, including the engine.
    const raw = await download(path,{
      signal, priority, wireSize:file?.size || 512*1024, maxBytes:file?.size, immutable:false,
      candidates:authenticated ? sources : [sources[0]]
    }, bytes => authenticated ? verify(bytes,expected) : bytes);
    if (cache && authenticated) await cacheWrite(cache,expected,raw);
    return raw;
  }

  async function read(name, {signal, priority='auto'} = {}) {
    checkAbort(signal);
    if (location.protocol === 'file:') throw new Error('离线游戏使用 HTML 内嵌资源');
    if (location.protocol !== 'https:' && location.protocol !== 'http:') throw new Error('不支持的网页地址');
    if (recent.has(name)) return recent.get(name).buffer.slice(0);
    const rank = name === '@engine' ? 2 : priority === 'high' ? 1 : priority === 'low' ? -1 : 0;
    const bytes = await shared('asset:'+name,signal,async jobSignal => {
      const result = await readFile(name,jobSignal,rank);
      checkAbort(jobSignal);
      remember(name,result);
      return result;
    });
    checkAbort(signal);
    return bytes.slice(0);
  }

  window.cloudIslesDelivery = {read};
})();
</script>
<script type="module">(async function launchGame() {
  const config = JSON.parse(document.getElementById('game-delivery-config').textContent);
  const delivery = window.cloudIslesDelivery;
  const warm = new AbortController();
  let url;
  try {
    if (!delivery) throw Error('Native delivery');
    const engine = delivery.read('@engine', {priority:'high'});
    let level;
    try { level = JSON.parse(localStorage.getItem('cloud-isles.expedition.v2'))?.current; } catch {}
    if (!config.levels.includes(level)) level = config.levels[0];
    // These are exactly the three full-quality resources used by init().
    // read() joins requests when the game takes over, including an in-flight one.
    const avatar = document.querySelector('meta[name="traveler-asset"]')?.content;
    for (const name of ['maps/'+level+'-walk.json','maps/'+level+'.glb',avatar].filter(Boolean)) {
      delivery.read(name, {signal:warm.signal}).catch(() => {});
    }
    url = URL.createObjectURL(new Blob([await engine], {type:'text/javascript'}));
    await import(url);
  } catch {
    try { await import(new URL(config.engine,document.baseURI).href); }
    catch {
      document.getElementById('loading').textContent = '网络连接中断，请重试。';
      const start = document.getElementById('start');
      start.disabled = false;
      start.querySelector('span').textContent = '重新载入';
      start.onclick = () => location.reload();
    }
  } finally {
    if (url) URL.revokeObjectURL(url);
    warm.abort();
  }
})();</script>

<body data-mode="cover">
<main id="app">
  <canvas id="world" aria-label="可旋转、可步行探索的三维巡灯地图"></canvas>
  <div id="veil" aria-hidden="true"></div>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-lamp" viewBox="0 0 32 36"><path d="M10 12 7 16l2 13 7 3 7-3 2-13-3-4ZM7 16l9 3 9-3m-9 3v13M10 12l6 3 6-3m-11 0 2-5h6l2 5M14 7V5a2 2 0 0 1 4 0v2"/><path d="m10 29-1 3 7 2 7-2-1-3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3Z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5q5-2 9 1 5-3 9-1v14q-5-2-9 1-4-3-9-1Zm9 1v14"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m2.5 5.5 6-2 7 3 6-2v15l-6 2-7-3-6 2Zm6-2v15m7-12v15"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.55 2.55 0 0 1 5 .4c0 2.1-2.6 2.3-2.6 4.3m0 3h.02"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13 0q3 3 0 6m2.5-9q6 6 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13 0 5 6m0-6-5 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M3 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16.5 7.5-3.2 5.8-5.8 3.2 3.2-5.8Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </defs></svg>

  <header class="topbar">
    <div class="wordmark"><span class="mark"><svg><use href="#i-lamp"/></svg></span>
      <span>云屿手记<small>CLOUD ISLES</small></span>
    </div>
    <nav aria-label="游戏菜单">
      <button id="atlas-open" class="navwide" aria-haspopup="dialog" aria-controls="atlas"><svg><use href="#i-map"/></svg><span>巡灯图册</span></button>
      <button id="help" class="round" title="操作指南" aria-label="操作指南"><svg><use href="#i-help"/></svg></button>
      <button id="audio" class="round" aria-label="开启声音" title="声音"><svg><use href="#i-mute"/></svg></button>
      <button id="pause" class="round playing" aria-label="暂停" title="暂停"><svg><use href="#i-pause"/></svg></button>
    </nav>
  </header>

  <section id="cover">
    <div class="chapter"><span id="cover-chapter">第一章</span><i aria-hidden="true"></i><b id="cover-place">浮空村落</b></div>
    <h1>云屿<span class="title-star" aria-hidden="true">✦</span><br>巡灯记</h1>
    <p class="intro" id="cover-intro">沿着木桥穿过漂浮的村落，<br>为瞭望塔送去一盏灯火。</p>
    <button class="primary" id="start" disabled><svg><use href="#i-lamp"/></svg><span>正在装载岛屿…</span><svg class="arr"><use href="#i-arrow"/></svg></button>
    <button id="fresh" class="textbutton" hidden>重新开始本关</button>
    <p id="loading" role="status"></p>
  </section>
  <footer id="cover-route">
    <div class="route-block"><span class="routelabel"><svg><use href="#i-compass"/></svg>本章路线</span>
      <div class="route-strip" id="route-strip"><span>码头</span><i></i><span>花坛</span><i></i><span>上桥</span><i></i><span>瞭望塔</span></div>
    </div>
    <div id="cover-maps" aria-label="选择巡灯地图"></div>
  </footer>

  <section id="quest" class="playing" aria-label="当前巡灯任务">
    <div class="quest-top"><span><svg><use href="#i-book"/></svg><span id="quest-place">浮空村落</span></span><b id="count">0 / 4</b></div>
    <div class="stamps" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h2 id="quest-name"></h2><p id="quest-copy"></p>
    <button id="guide"><svg><use href="#i-compass"/></svg><span>沿路前往</span></button>
  </section>
  <div id="joystick" role="group" aria-label="移动摇杆，按住并拖动以行走">
    <svg class="joystick-directions" viewBox="0 0 100 100" aria-hidden="true">
      <path d="m46 14 4-4 4 4m32 32 4 4-4 4M54 86l-4 4-4-4M14 54l-4-4 4-4"/>
    </svg>
    <span id="joystick-knob" aria-hidden="true"></span>
  </div>
  <div class="playing" id="viewtools">
    <button id="overview" class="round" aria-label="全景视角" title="全景 / 跟随视角"><svg><use href="#i-compass"/></svg></button>
    <button id="closer" class="round" aria-label="拉近镜头" title="拉近">+</button>
    <button id="farther" class="round" aria-label="拉远镜头" title="拉远">−</button>
  </div>
  <div class="playing" id="motions">
    <button id="run-mode" type="button" aria-pressed="false" title="切换奔跑，亦可按住 Shift">奔跑</button>
    <button id="wave" type="button" hidden title="挥手 · H">挥手</button>
  </div>
  <div id="lower" class="playing"><span><kbd>W A S D</kbd> 行走</span><span>拖动环视 · 滚轮缩放</span></div>
  <div id="interaction" hidden><button id="act" class="primary"><kbd>E</kbd><span>领取提灯</span></button></div>
  <div id="notice" role="status"></div>
  <div id="pin" hidden><span class="pin-star" aria-hidden="true">✧</span><span id="pin-title"></span></div>

  <div id="modal" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="page">
      <button id="close" class="round" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
      <svg class="page-icon" aria-hidden="true"><use href="#i-lamp"/></svg>
      <h2 id="modal-title"></h2><div id="modal-copy"></div>
      <button class="primary" id="modal-main"></button><button id="modal-second" class="textbutton" hidden></button>
    </section>
  </div>

  <dialog id="atlas" aria-labelledby="atlas-title">
    <div class="atlas-shell">
      <header class="atlas-heading">
        <div><svg class="atlas-mark" aria-hidden="true"><use href="#i-map"/></svg><h2 id="atlas-title">巡灯图册</h2></div>
        <span class="atlas-progress" id="atlas-progress"></span>
        <button id="atlas-close" class="round" title="合上图册" aria-label="合上图册" autofocus><svg><use href="#i-x"/></svg></button>
      </header>
      <div class="atlas-spread">
        <figure class="atlas-plate">
          <div class="atlas-illustration"><img id="plate-image" alt=""><span class="plate-compass" aria-hidden="true"><svg><use href="#i-compass"/></svg></span></div>
          <figcaption><span class="chapter" id="plate-chapter"></span><h3 id="plate-title"></h3><p id="plate-intro"></p></figcaption>
        </figure>
        <div class="atlas-index"><h3>选择地图</h3><div id="atlas-list"></div></div>
      </div>
    </div>
  </dialog>
</main>
</body></html>
